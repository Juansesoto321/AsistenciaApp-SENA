# HTTP. Es la configuración normal: en tu computador y cuando el SENA publica
# el sistema detrás de su propio proxy con HTTPS. Si este mismo servidor tiene
# el certificado, se usa nginx-https.conf (docker-compose.https.yml).
server {
  listen 80;
  client_max_body_size 10m;

  # Compresión: la red del SENA y los datos móviles lo agradecen
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Encabezados de seguridad para la aplicación web
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # Los enlaces de justificación llevan un token en la URL: que no se filtre a otros sitios
  add_header Referrer-Policy "same-origin" always;

  # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo
  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    # (un add_header aquí reemplaza los del server: se repite nosniff)
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  include /etc/nginx/asistenciaapp/rutas.conf;
}
