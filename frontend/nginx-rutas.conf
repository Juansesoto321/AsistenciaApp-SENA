# Rutas que comparten nginx.conf (HTTP) y nginx-https.conf (HTTPS).
# Sin add_header aquí: los encabezados de seguridad van en cada server, y un
# add_header dentro de una location reemplazaría los del server.

# React Router: cualquier ruta sirve index.html. "expires -1" (Cache-Control:
# no-cache) hace que el navegador pregunte siempre por index.html: si lo guarda,
# después de actualizar la app seguiría pidiendo los /assets/ de la versión
# vieja. Es "expires" y no add_header, así que no reemplaza los del server.
location / {
  root /usr/share/nginx/html;
  try_files $uri /index.html;
  expires -1;
}

# Proxy de la API y Socket.IO hacia el backend. X-Forwarded-For lleva la IP
# real del cliente (la usa el límite de peticiones del backend).
location /api/ {
  proxy_pass http://backend:4000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location /socket.io/ {
  proxy_pass http://backend:4000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
