# HTTPS cuando este mismo servidor tiene el certificado (docker-compose.https.yml).
# Si el SENA publica el sistema detrás de su propio proxy con HTTPS, no hace
# falta: basta nginx.conf.
# El certificado va en ./certificados del proyecto (fullchain.pem y privkey.pem).

server {
  listen 80;
  # Todo lo que llegue por HTTP pasa a HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  ssl_certificate     /etc/nginx/certificados/fullchain.pem;
  ssl_certificate_key /etc/nginx/certificados/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 10m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # HSTS: el navegador ya no vuelve a intentar entrar por HTTP
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    # (un add_header aquí reemplaza los del server: se repiten HSTS y nosniff)
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  include /etc/nginx/asistenciaapp/rutas.conf;
}
