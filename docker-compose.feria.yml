# ============================================================
# AsistenciaApp · Entorno de la feria del SENA (datos FICTICIOS)
# Corre aparte de cualquier otra copia: su propio proyecto, su propia base y
# sus propios puertos. Al arrancar siembra la ficha de la feria si la base
# está vacía (backend/src/scripts/sembrar-feria.js).
#   docker compose -f docker-compose.feria.yml up -d --build
# App: http://localhost:8070
# Puertos ocupados por las otras copias: 4000/8080/8081 y 4100/8090/8091. Si
# alguno de los de aquí está ocupado, cámbialo en el .env con FERIA_PUERTO_API,
# FERIA_PUERTO_WEB o FERIA_PUERTO_VISOR_BD (y FERIA_URL_FRONTEND con el web).
# No lee las variables de correo del .env: ningún correo sale por SMTP, solo
# se imprime en la consola del backend.
# ============================================================
name: asistenciaapp-feria

services:
  basedatos:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asistenciaapp
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Siembra (o deja como está) la base de la feria y después arranca la API
    command: ["sh", "-c", "node src/scripts/sembrar-feria.js && exec node src/app.js"]
    ports:
      - "${FERIA_PUERTO_API:-4070}:4000"   # solo si se conecta un lector físico (ADMS)
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@basedatos:5432/asistenciaapp
      # Claves de ejemplo del repositorio: sirven porque aquí solo hay datos ficticios
      JWT_SECRETO: cambia_esta_clave_en_produccion
      CLAVE_CIFRADO: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PUERTO: 4000
      URL_FRONTEND: ${FERIA_URL_FRONTEND:-http://localhost:8070}
      # Vacío a propósito, aunque el .env tenga un SMTP real: los correos solo van a la consola
      CORREO_HOST: ""
      IP_LECTORES: ""
    volumes:
      - ./db:/db:ro          # el script de siembra lee /db/init.sql
    depends_on:
      basedatos:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FERIA_PUERTO_WEB:-8070}:80"
    depends_on:
      - backend

  # Visor de la base, solo lectura y solo en este computador:
  #   docker compose -f docker-compose.feria.yml --profile herramientas up -d visor-bd   ->  http://localhost:8071
  visor-bd:
    image: sosedoff/pgweb:0.16.2
    profiles: ["herramientas"]
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--readonly", "--url=postgres://postgres:postgres@basedatos:5432/asistenciaapp?sslmode=disable"]
    ports:
      - "127.0.0.1:${FERIA_PUERTO_VISOR_BD:-8071}:8081"
    depends_on:
      basedatos:
        condition: service_healthy

volumes:
  datos_pg:
    # Nombre fijo: aunque el proyecto se llamara distinto, nunca usa la base de otra copia
    name: asistenciaapp-feria_datos_pg
