<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AsistenciaApp SENA · huella con marco de escáner y línea de escaneo -->
  <defs>
    <linearGradient id="marco" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#46ef7d"/><stop offset="0.55" stop-color="#1fbf63"/><stop offset="1" stop-color="#0e9f6e"/>
    </linearGradient>
    <linearGradient id="huella" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="444">
      <stop offset="0" stop-color="#46ef7d"/><stop offset="0.6" stop-color="#22c55e"/><stop offset="1" stop-color="#0e9f6e"/>
    </linearGradient>
    <filter id="resplandor" filterUnits="userSpaceOnUse" x="0" y="155" width="512" height="100">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g fill="none" stroke="url(#marco)" stroke-width="30" stroke-linecap="round">
    <path d="M36 152V82A46 46 0 0 1 82 36H152"/>
    <path d="M360 36H430A46 46 0 0 1 476 82V152"/>
    <path d="M476 360V430A46 46 0 0 1 430 476H360"/>
    <path d="M152 476H82A46 46 0 0 1 36 430V360"/>
  </g>
  <g fill="none" stroke="url(#huella)" stroke-width="20" stroke-linecap="round">
    <ellipse cx="256" cy="258" rx="22" ry="28" pathLength="100" stroke-dasharray="64 36" stroke-dashoffset="-43"/>
    <ellipse cx="256" cy="258" rx="48" ry="60" pathLength="100" stroke-dasharray="34 5 39 22" stroke-dashoffset="-36"/>
    <ellipse cx="256" cy="258" rx="74" ry="92" pathLength="100" stroke-dasharray="26 4 30 5 21 14" stroke-dashoffset="-32"/>
    <ellipse cx="256" cy="258" rx="100" ry="124" pathLength="100" stroke-dasharray="40 5 41 14" stroke-dashoffset="-32"/>
    <ellipse cx="256" cy="258" rx="126" ry="156" pathLength="100" stroke-dasharray="22 5 36 4 21 12" stroke-dashoffset="-31"/>
    <ellipse cx="256" cy="258" rx="152" ry="186" pathLength="100" stroke-dasharray="46 6 36 12" stroke-dashoffset="-31"/>
  </g>
  <!-- Línea de escaneo: resplandor verde y centro claro, más ancha que el marco -->
  <line x1="12" y1="205" x2="500" y2="205" stroke="#3ee67a" stroke-width="22" stroke-linecap="round" opacity="0.6" filter="url(#resplandor)"/>
  <line x1="18" y1="205" x2="494" y2="205" stroke="#3ee67a" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="205" x2="452" y2="205" stroke="#eafff1" stroke-width="3.5" stroke-linecap="round"/>
</svg>
