# Integración continua: pruebas del backend y compilación del frontend en
# cada PR hacia main y en cada push a main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Base desechable para las pruebas de integración (se borra con el job)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20 # la misma de backend/Dockerfile
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: npm test
        shell: bash
        env:
          DATABASE_URL_PRUEBAS: postgres://postgres:postgres@localhost:5432/asistenciaapp_pruebas
          # tests/preparar.js ya los fuerza; se repiten aquí para que en CI
          # nunca haya SMTP real, ni siquiera si alguien cambia ese archivo
          NODE_ENV: test
          CORREO_HOST: ""
        run: npm test -- --test-reporter=spec | tee resultado-pruebas.txt
      # Sin PostgreSQL las pruebas de integración se omiten en vez de fallar;
      # en CI eso escondería errores, así que una sola omitida tumba el job.
      - name: Ninguna prueba omitida
        shell: bash
        run: |
          if ! grep -Eq "skipped 0$" resultado-pruebas.txt; then
            echo "::error::Hay pruebas omitidas: PostgreSQL no estuvo disponible para las de integración"
            exit 1
          fi

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20 # la misma de frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
