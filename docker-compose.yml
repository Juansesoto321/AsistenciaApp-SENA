# ============================================================
# AsistenciaApp · Despliegue con Docker
# En tu computador (datos de demostración):
#   docker compose up -d --build
#   docker compose exec backend npm run sembrar             (primera vez)
# En un servidor real (ver README, "En un servidor real"): .env con claves
# propias y el archivo de producción encima de este:
#   docker compose -f docker-compose.yml -f docker-compose.produccion.yml up -d --build
#   docker compose exec backend npm run migrar              (al instalar y al actualizar)
#   docker compose exec backend npm run crear-coordinador   (primera cuenta)
# App: http://localhost:8080
# Para correrla junto a otra copia que ya usa 4000, 8080 y 8081, pon otros
# puertos en el .env de esta carpeta (PUERTO_API, PUERTO_WEB, PUERTO_VISOR_BD)
# y URL_FRONTEND con el nuevo puerto web, para que los enlaces de los correos
# apunten bien.
# ============================================================
services:
  basedatos:
    image: postgres:16-alpine
    # Vuelve a arrancar solo si el servidor se reinicia o el proceso se cae
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asistenciaapp
    ports:
      - "${PUERTO_BD:-5433}:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${PUERTO_API:-4000}:4000"   # necesario para que el lector fisico real (ADMS) alcance el backend
    environment:
      # production: no arranca con las claves de ejemplo y no siembra datos de demostración
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://postgres:postgres@basedatos:5432/asistenciaapp
      JWT_SECRETO: ${JWT_SECRETO:-cambia_esta_clave_en_produccion}
      CLAVE_CIFRADO: ${CLAVE_CIFRADO:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PUERTO: 4000
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:8080}
      CORREO_HOST: ${CORREO_HOST:-}
      CORREO_PUERTO: ${CORREO_PUERTO:-587}
      CORREO_USUARIO: ${CORREO_USUARIO:-}
      CORREO_CONTRASENA: ${CORREO_CONTRASENA:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-AsistenciaApp SENA <no-responder@asistenciaapp.co>}
      # IP de los lectores reales, separadas por comas: solo ellos pueden enviar marcas (/iclock)
      IP_LECTORES: ${IP_LECTORES:-}
      # Clase de demostración con botón para reiniciarla: vacío = activa salvo en producción; "false" la apaga
      CLASE_DEMO: ${CLASE_DEMO:-}
    volumes:
      - ./db:/db:ro          # el script de siembra lee /db/init.sql
    depends_on:
      basedatos:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-8080}:80"
    depends_on:
      - backend

  # Copia de seguridad de la base de datos: una al arrancar y luego una al día,
  # en la carpeta respaldos/ del proyecto (se guardan 14 días).
  #   Copia ya:  docker compose exec respaldos /respaldar.sh ahora
  #   Restaurar: docker compose exec respaldos /restaurar.sh <archivo>
  respaldos:
    image: postgres:16-alpine
    environment:
      PGHOST: basedatos
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: asistenciaapp
      TZ: America/Bogota
      RESPALDO_CADA_HORAS: ${RESPALDO_CADA_HORAS:-24}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-14}
    entrypoint: ["/bin/sh", "/respaldar.sh"]
    volumes:
      - ./respaldos:/respaldos
      - ./db/respaldos/respaldar.sh:/respaldar.sh:ro
      - ./db/respaldos/restaurar.sh:/restaurar.sh:ro
    depends_on:
      basedatos:
        condition: service_healthy
    restart: unless-stopped

  # Visor web de la base de datos, SOLO LECTURA y solo en este computador.
  # No arranca solo; se abre cuando se necesita:
  #   docker compose --profile herramientas up -d visor-bd   ->  http://localhost:8081
  #   docker compose --profile herramientas stop visor-bd
  visor-bd:
    image: sosedoff/pgweb:0.16.2
    profiles: ["herramientas"]
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--readonly", "--url=postgres://postgres:postgres@basedatos:5432/asistenciaapp?sslmode=disable"]
    ports:
      - "127.0.0.1:${PUERTO_VISOR_BD:-8081}:8081"
    depends_on:
      basedatos:
        condition: service_healthy

volumes:
  datos_pg: